name: Build Android APK & Release (Rust Core)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Rust Core, Sign Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Commit Message for Skip
        id: check_skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE "\[skip ci\]|chore\(release\):"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Auto-Bump Android Version in All Files
        id: bump
        if: github.ref == 'refs/heads/main' && steps.check_skip.outputs.skip == 'false'
        run: |
          CURRENT_CODE=$(grep "versionCode" android/app/build.gradle | head -1 | tr -dc '0-9')
          CURRENT_NAME=$(grep "versionName" android/app/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          git fetch --tags origin --force || true
          NEW_CODE=$((CURRENT_CODE + 1))
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
          NEW_PATCH=$((PATCH + 1))
          while git rev-parse "v${MAJOR}.${MINOR}.${NEW_PATCH}" >/dev/null 2>&1; do
            NEW_PATCH=$((NEW_PATCH + 1))
            NEW_CODE=$((NEW_CODE + 1))
          done
          NEW_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "Bumping versionCode $CURRENT_CODE -> $NEW_CODE"
          echo "Bumping versionName $CURRENT_NAME -> $NEW_NAME"
          
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" android/app/build.gradle
          sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/" android/app/build.gradle
          
          if [ -f package.json ]; then
            jq --arg ver "$NEW_NAME" '.version = $ver' package.json > package.tmp.json && mv package.tmp.json package.json
          fi

          if [ -f www/version.json ]; then
            jq --arg ver "$NEW_NAME" --argjson code "$NEW_CODE" 'if has("versionCode") then .versionCode = $code else . end | .version = $ver' www/version.json > www/version.tmp.json && mv www/version.tmp.json www/version.json
          fi

          if [ -f www/app.js ]; then
            sed -i -E "s/const CURRENT_APP_VERSION = 'v[0-9.]+';/const CURRENT_APP_VERSION = 'v$NEW_NAME';/g" www/app.js
            sed -i -E "s/const APP_VERSION = 'v[0-9.]+';/const APP_VERSION = 'v$NEW_NAME';/g" www/app.js
          fi

          if [ -f www/index.html ]; then
            sed -i -E "s/(id=\"app-version-display\">v?)[0-9]+\.[0-9]+\.[0-9]+/\1$NEW_NAME/g" www/index.html
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          [ -f package.json ] && git add package.json
          [ -f www/version.json ] && git add www/version.json
          [ -f www/app.js ] && git add www/app.js
          [ -f www/index.html ] && git add www/index.html
          git commit -m "chore(release): auto-bump version to v$NEW_NAME [skip ci]" || true
          git tag -f "v$NEW_NAME"
          git pull --rebase origin main || true
          git push origin main
          git push -f origin "v$NEW_NAME"

      - name: Get Target Tag
        id: target_tag
        run: |
          TAG=$(grep "versionName" android/app/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          echo "tag=v$TAG" >> $GITHUB_OUTPUT

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust Toolchain & Android NDK Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-core -> target"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Compile Native Rust Core (liblauju_app_core.so) for Android ABIs
        run: |
          cargo install cargo-ndk --locked
          cd rust-core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release
          ls -la ../android/app/src/main/jniLibs/*/liblauju_app_core.so

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign & Verify Release APK (V1 + V2 + V3 F-Droid / Play Protect Standard)
        run: |
          TAG="${{ steps.target_tag.outputs.tag }}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ] && [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            mv "android/app/build/outputs/apk/release/app-release-unsigned.apk" "$APK_PATH"
          fi
          rm -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$APK_PATH" ]; then
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            [ -z "$KS_PASS" ] && KS_PASS="LauriAndroid2026!"
            K_ALIAS="${{ secrets.KEY_ALIAS }}"
            [ -z "$K_ALIAS" ] && K_ALIAS="releasekey"
            "$BUILD_TOOLS/apksigner" sign \
              --ks android/app/release.keystore \
              --ks-key-alias "$K_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KS_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$APK_PATH"
            "$BUILD_TOOLS/apksigner" verify --print-certs -v "$APK_PATH"
            cp "$APK_PATH" "android/app/build/outputs/apk/release/Audio_Mini_Games_${TAG}.apk"
          else
            echo "ERROR: Release APK not found!"
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Generate Changelog from Commits
        id: changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ steps.target_tag.outputs.tag }}"
          CODE=$(grep "versionCode" android/app/build.gradle | head -1 | tr -dc '0-9')
          echo "## Änderungsprotokoll für $TAG (Build-Code $CODE)" > release_notes.md
          echo "" >> release_notes.md
          echo "### Was hat sich geändert:" >> release_notes.md
          
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges 2>/dev/null | grep -vE "chore\(release\)|chore\(ci\)|\[skip ci\]" || true)
          else
            COMMITS=$(git log -n 5 --pretty=format:"- %s" --no-merges 2>/dev/null | grep -vE "chore\(release\)|chore\(ci\)|\[skip ci\]" || true)
          fi
          
          if [ -z "$COMMITS" ]; then
            COMMITS="- Nativ kompiliert mit Rust-Sicherheitskern (liblauju_app_core.so) und V1+V2+V3 Release-Signatur"
          fi
          
          echo "$COMMITS" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*Vollautomatisch gebaut mit nativem Rust-Kern (liblauju_app_core.so) und V1+V2+V3 Release-Signatur (F-Droid & Play Protect konform).*" >> release_notes.md

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target_tag.outputs.tag }}
          name: "Audio Mini Games ${{ steps.target_tag.outputs.tag }}"
          files: |
            android/app/build/outputs/apk/release/*.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Custom F-Droid Repo Update
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          gh workflow run update-repo.yml --repo Lauju1909/fdroid-repo || true
          
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TRIGGER }}
