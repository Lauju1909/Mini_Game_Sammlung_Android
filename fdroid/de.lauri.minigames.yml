AutoName: Audio Mini Games
Summary: Über 60 barrierefreie Audio-Minispiele für Blinde und Sehbehinderte
Description: |-
  Audio Mini Games ist eine umfangreiche Sammlung von barrierefreien Audiogames,
  die ohne Display allein über Gehör, Audio-Feedback und Haptik gespielt werden können.

  Features:
  - Über 60 verschiedene Minispiele (Action, Logik, 3D-Navigation, Sprache, Simulation)
  - 100% spielbar mit TalkBack oder integrierter Audio-Engine
  - 3D-Binauraler Stereosound für akustische Ortung
  - Haptisches Feedback
  - Bestenlisten und Highscores
  - Werbefrei, kein Tracking, komplett offline spielbar

RepoType: git
