<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Audio Mini Games - 100% Barrierefrei für Blinde & Sehbehinderte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-oled" id="app-body">
  <div id="sr-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div id="sr-polite" class="sr-only" aria-live="polite"></div>

  <!-- HEADER -->
  <header class="game-header">
    <div class="header-title">
      <h1>🎮 Audio Mini Games</h1>
      <span class="sub-badge" id="app-version">v2.2 • 75 Spiele</span>
      <span class="sub-badge" id="gamepad-badge" style="display: none; background: #059669; color: #fff;">🎮 Controller</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-icon" id="btn-lang" aria-label="Sprache wechseln (Deutsch / English)" onclick="toggleLanguage()">🇩🇪</button>
      <button type="button" class="btn-icon" id="btn-random" aria-label="Zufälliges Spiel starten" onclick="startRandomGame()">🎲</button>
      <button type="button" class="btn-icon" id="btn-toggle-tts" aria-label="Sprachausgabe umschalten" onclick="toggleTTS()">🔊</button>
      <button type="button" class="btn-icon" id="btn-feedback" aria-label="Feedback oder Idee senden" onclick="openFeedbackModal()">💬</button>
      <button type="button" class="btn-icon" id="btn-open-settings" aria-label="Einstellungen öffnen" onclick="openSettings()">⚙️</button>
    </div>
  </header>

  <!-- HAUPTANSICHT: MENÜ -->
  <main id="view-menu" class="view-screen active" role="main">
    <!-- Suchleiste -->
    <div class="search-bar-container">
      <input type="search" id="game-search" class="search-input" placeholder="🔍 Spiel suchen... / Search game..." oninput="onSearchInput(this.value)" aria-label="Spiele durchsuchen">
    </div>

    <!-- Kategorien-Reiter -->
    <div class="category-tabs" role="tablist" aria-label="Spiel-Kategorien">
      <button role="tab" id="tab-all" aria-selected="true" class="cat-tab active" onclick="selectCategory('all', this)">Alle (75)</button>
      <button role="tab" id="tab-action" aria-selected="false" class="cat-tab" onclick="selectCategory('action', this)">Action (30)</button>
      <button role="tab" id="tab-logic" aria-selected="false" class="cat-tab" onclick="selectCategory('logic', this)">Logik (17)</button>
      <button role="tab" id="tab-nav" aria-selected="false" class="cat-tab" onclick="selectCategory('nav', this)">Navigation (12)</button>
      <button role="tab" id="tab-speech" aria-selected="false" class="cat-tab" onclick="selectCategory('speech', this)">Wissen (10)</button>
      <button role="tab" id="tab-sim" aria-selected="false" class="cat-tab" onclick="selectCategory('sim', this)">Simulation (6)</button>
    </div>

    <div class="game-list-container" id="game-list" role="list" aria-label="Liste der Audiospiele">
      <!-- Dynamisch befüllt -->
    </div>
  </main>

  <!-- SPIEL-ANSICHT -->
  <section id="view-game" class="view-screen" aria-label="Laufendes Spiel" style="display: none;">
    <div class="game-hud">
      <button type="button" class="btn-hud" id="btn-hud-menu" onclick="leaveGame()" aria-label="Spiel beenden und zurück zum Menü">◀ Menü</button>
      <div class="hud-center">
        <h2 id="game-hud-title">Spielname</h2>
        <div class="score-display" id="game-hud-score">Punkte: 0</div>
      </div>
      <button type="button" class="btn-hud" id="btn-hud-help" onclick="repeatTutorial()" aria-label="Anleitung nochmals anhören">❓ Hilfe</button>
    </div>

    <div class="visualizer-box" aria-hidden="true">
      <canvas id="game-canvas" width="600" height="220" class="game-canvas"></canvas>
      <div class="status-msg" id="hud-status">Kopfhörer empfohlen für 3D-Stereo-Sound!</div>
    </div>

    <!-- Tastenleiste für Ziffern (1-4) bei Quiz- und Wissensspielen -->
    <div class="number-key-bar" id="number-key-bar" style="display: none;">
      <button type="button" class="btn-num" onclick="triggerAction('1')" aria-label="Taste 1">1</button>
      <button type="button" class="btn-num" onclick="triggerAction('2')" aria-label="Taste 2">2</button>
      <button type="button" class="btn-num" onclick="triggerAction('3')" aria-label="Taste 3">3</button>
      <button type="button" class="btn-num" onclick="triggerAction('4')" aria-label="Taste 4">4</button>
    </div>

    <!-- Ergonomische Touch-Steuerflächen mit 4-Wege-Richtung + Aktion -->
    <div class="touch-control-grid" id="touch-controls">
      <div class="touch-row-top">
        <button type="button" class="touch-btn touch-up" id="btn-touch-up" aria-label="Oben steuern">
          <span class="touch-icon">▲</span>
          <span class="touch-label" id="touch-label-up">OBEN</span>
        </button>
      </div>
      <div class="touch-row-mid">
        <button type="button" class="touch-btn touch-left" id="btn-touch-left" aria-label="Links steuern">
          <span class="touch-icon">◀</span>
          <span class="touch-label" id="touch-label-left">LINKS</span>
        </button>
        <button type="button" class="touch-btn touch-action" id="btn-touch-action" aria-label="Aktion ausführen / Bestätigen">
          <span class="touch-icon">🔘</span>
          <span class="touch-label" id="touch-label-action">AKTION</span>
        </button>
        <button type="button" class="touch-btn touch-right" id="btn-touch-right" aria-label="Rechts steuern">
          <span class="touch-icon">▶</span>
          <span class="touch-label" id="touch-label-right">RECHTS</span>
        </button>
      </div>
      <div class="touch-row-bot">
        <button type="button" class="touch-btn touch-down" id="btn-touch-down" aria-label="Unten steuern">
          <span class="touch-icon">▼</span>
          <span class="touch-label" id="touch-label-down">UNTEN</span>
        </button>
      </div>
    </div>
  </section>

  <!-- FEEDBACK MODAL -->
  <div id="modal-feedback" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="feedback-title" style="display: none;">
    <div class="modal-card">
      <h2 id="feedback-title">💬 Feedback & Ideen senden</h2>
      <p id="feedback-desc" style="font-size: 0.9rem; color: #a0aec0; margin: 0;">Dein Feedback landet direkt bei Entwickler Lauju in der Feedback-Zentrale.</p>
      
      <div class="setting-group">
        <label for="fb-sender" id="label-fb-sender">Dein Name / Alias (optional):</label>
        <input type="text" id="fb-sender" class="search-input" placeholder="z. B. Alex oder Anonym">
      </div>

      <div class="setting-group">
        <label for="fb-text" id="label-fb-text">Deine Nachricht / Fehlerbericht / Spiel-Idee:</label>
        <textarea id="fb-text" class="search-input" rows="4" style="resize: vertical; font-family: inherit;" placeholder="Was gefällt dir? Was können wir verbessern?"></textarea>
      </div>

      <div id="fb-status" aria-live="polite" style="min-height: 24px; font-weight: bold; font-size: 0.95rem;"></div>

      <div style="display: flex; gap: 10px; margin-top: 6px;">
        <button type="button" class="btn-primary" id="btn-fb-submit" style="flex: 2;" onclick="sendFeedback()">📤 Absenden</button>
        <button type="button" class="btn-danger" id="btn-fb-cancel" style="flex: 1;" onclick="closeFeedbackModal()">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- EINSTELLUNGEN MODAL -->
  <div id="modal-settings" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" style="display: none;">
    <div class="modal-card">
      <h2 id="settings-title">⚙️ Einstellungen & Barrierefreiheit</h2>
      <div class="setting-group">
        <label for="set-language-select" id="label-language-select">Sprache / Language:</label>
        <select id="set-language-select" class="form-select" onchange="onLanguageSelect(this.value)">
          <option value="de">Deutsch (DE)</option>
          <option value="en">English (EN)</option>
        </select>
      </div>
      <div class="setting-group">
        <label for="set-volume-effects" id="label-vol-effects">Lautstärke Soundeffekte (Stereo):</label>
        <input type="range" id="set-volume-effects" min="0" max="100" value="80" onchange="updateAudioSettings()">
      </div>
      <div class="setting-group">
        <label for="set-volume-tts" id="label-vol-tts">Lautstärke Sprachassistent:</label>
        <input type="range" id="set-volume-tts" min="0" max="100" value="90" onchange="updateAudioSettings()">
      </div>
      <div class="setting-group">
        <label for="set-speech-rate" id="label-speech-rate">Sprechgeschwindigkeit:</label>
        <input type="range" id="set-speech-rate" min="5" max="20" value="11" onchange="updateAudioSettings()">
      </div>
      <div class="setting-group">
        <label>
          <input type="checkbox" id="set-vibrate" checked onchange="updateAudioSettings()">
          <span id="label-vibrate-text">Haptisches Vibrations-Feedback bei Aktionen</span>
        </label>
      </div>
      <div class="setting-group-actions">
        <button type="button" class="btn-danger" id="btn-reset-highscores" onclick="resetAllHighscores()">🗑️ Rekorde zurücksetzen</button>
      </div>
      <button type="button" class="btn-primary" id="btn-save-settings" onclick="closeSettings()">Fertig & Speichern</button>
    </div>
  </div>

  <script src="audio_engine.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let r of registrations) r.unregister();
      }).catch(() => {});
      if (window.caches) {
        caches.keys().then(keys => {
          keys.forEach(k => caches.delete(k));
        }).catch(() => {});
      }
    }
  </script>
</body>
</html>
